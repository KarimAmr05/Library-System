<a href="#main-content" class="skip-link">Skip to main content</a>

@if (!isAuthRoute()) {
  <app-header
    [menuOpen]="sidebarOpen()"
    (menuToggled)="toggleSidebar()"
    (signOutRequested)="signOut()"
  />
}

<main id="main-content" class="shell" [class.shell--bare]="isAuthRoute()">
  @if (!isAuthRoute()) {
    @if (sidebarBackdropVisible()) {
      <div class="shell__backdrop" aria-hidden="true" (click)="toggleSidebar()"></div>
    }
    <app-sidebar
      [open]="sidebarOpen()"
      [collapsed]="sidebarCollapsed()"
      (closeRequested)="sidebarOpen.set(false)"
      (collapseToggled)="sidebarCollapsed.set(!sidebarCollapsed())"
      (deleteRequested)="deleteDialogOpen.set(true)"
    />
    <div class="shell__content">
      <router-outlet />
    </div>
  } @else {
    <router-outlet />
  }
</main>

@if (deleteDialogOpen()) {
  @if (authStore.currentUser(); as user) {
    <app-delete-account-dialog
      [email]="user.email"
      (cancelled)="deleteDialogOpen.set(false)"
      (deleted)="onAccountDeleted()"
    />
  }
}
